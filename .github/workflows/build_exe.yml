name: Build Offline Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller (Collecting Streamlit Metadata)
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "DocuFlow_Studio" --collect-all streamlit --copy-metadata streamlit app.py

    - name: Upload EXE Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocuFlow_Studio_Windows_Offline
        path: dist/DocuFlow_Studio
